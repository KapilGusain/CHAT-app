name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ghcr.io/kapilgusain/chat-app-web:sha-${{ github.sha }}
            ghcr.io/kapilgusain/chat-app-web:latest
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.realtime
          push: true
          tags: |
            ghcr.io/kapilgusain/chat-app-realtime:sha-${{ github.sha }}
            ghcr.io/kapilgusain/chat-app-realtime:latest
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            cd ~/apps/CHAT-app

            git fetch origin main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.production -f docker-compose.prod.yml pull
            IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans

            IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.production -f docker-compose.prod.yml exec -T realtime-lb wget -qO- http://127.0.0.1:4000/health
            curl -fsS http://127.0.0.1/ >/dev/null

            docker image prune -f
