name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ghcr.io/kapilgusain/chat-app-web:sha-${{ github.sha }}
            ghcr.io/kapilgusain/chat-app-web:latest
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.realtime
          push: true
          tags: |
            ghcr.io/kapilgusain/chat-app-realtime:sha-${{ github.sha }}
            ghcr.io/kapilgusain/chat-app-realtime:latest
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::677938781577:role/ChatAppGitHubDeployRole
          aws-region: ap-south-1

      - name: Deploy through SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "i-037e13edc2021e709" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy chat-app ${GITHUB_SHA}" \
              --parameters 'commands=[
                "set -e",
                "cd /home/ubuntu/apps/CHAT-app",
                "git config --system --add safe.directory /home/ubuntu/apps/CHAT-app",
                "git fetch origin main",
                "git reset --hard origin/main",
                "IMAGE_TAG=sha-'${GITHUB_SHA}' docker compose --env-file .env.production -f docker-compose.prod.yml pull",
                "IMAGE_TAG=sha-'${GITHUB_SHA}' docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans",
                "docker compose --env-file .env.production -f docker-compose.prod.yml exec -T realtime-lb wget -qO- http://127.0.0.1:4000/health",
                "curl -fsS http://127.0.0.1/ >/dev/null",
                "docker image prune -f"
              ]' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-037e13edc2021e709" \
                --query "Status" \
                --output text
            )"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-037e13edc2021e709"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-037e13edc2021e709" || true
          exit 1