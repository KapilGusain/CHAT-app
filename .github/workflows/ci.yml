name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Lint web
        run: npm run lint --workspace=web

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npx prisma generate

      - name: Install Linux TypeScript binary
        run: npm install --no-save @typescript/typescript-linux-x64

      - name: Build realtime TypeScript
        run: npm run build:realtime

      - name: Run tests when configured
        shell: bash
        run: |
          found=0
          for workspace in . web realtime; do
            if [ "$workspace" = "." ]; then
              script=$(node -p "require('./package.json').scripts?.test || ''")
            else
              script=$(node -p "require('./$workspace/package.json').scripts?.test || ''")
            fi

            if [ -n "$script" ]; then
              found=1
              echo "Running tests for $workspace"
              if [ "$workspace" = "." ]; then
                npm test
              else
                npm test --workspace="$workspace"
              fi
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No test script is configured yet; CI test stage is ready for the first test suite."
          fi

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: checks

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: false
          tags: chat-app-web:ci-${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.realtime
          push: false
          tags: chat-app-realtime:ci-${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime
